<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตารางงานพนักงาน - BP SNOOKER CLUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', 'Segoe UI', sans-serif;
            background: #0F172A;
            min-height: 100vh;
            color: #E2E8F0;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
            border-bottom: 1px solid #334155;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-title {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .header-title .subtitle {
            font-size: 11px;
            letter-spacing: 3px;
            color: #64748B;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .header-title .title {
            font-size: 22px;
            font-weight: 700;
            color: #F1F5F9;
            letter-spacing: -0.5px;
        }

        .tab-buttons {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            background: #1E293B;
            color: #94A3B8;
            transition: all 0.15s;
        }

        .tab-btn.active {
            background: #3B82F6;
            color: #fff;
        }

        .container {
            padding: 20px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Quick info bar */
        .info-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .chip {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 12px;
            color: #94A3B8;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #1E293B;
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 600px;
        }

        th {
            padding: 12px 10px;
            background: #0F172A;
            color: #CBD5E1;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            min-width: 110px;
            border-left: 1px solid #334155;
        }

        th:first-child {
            text-align: left;
            width: 90px;
            border-left: none;
            padding: 12px 16px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #64748B;
        }

        .day-header-full {
            color: #94A3B8;
            font-size: 11px;
            margin-bottom: 2px;
        }

        .day-header-abbr {
            font-size: 16px;
        }

        td {
            border-top: 1px solid #334155;
            border-left: 1px solid #334155;
            padding: 6px;
            vertical-align: middle;
            text-align: center;
        }

        td:first-child {
            padding: 10px 16px;
            background: #1A2744;
            border-left: none;
            text-align: left;
        }

        .shift-label {
            display: inline-block;
            border-radius: 6px;
            padding: 3px 9px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 2px;
        }

        .shift-time {
            font-size: 10px;
            color: #64748B;
            margin-top: 2px;
        }

        .cell-button {
            width: 100%;
            min-height: 52px;
            border: 2px dashed #334155;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            transition: all 0.15s;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font-family: inherit;
        }

        .cell-button:hover {
            background: #334155;
        }

        .cell-button.filled {
            border: none;
        }

        .emp-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            color: #fff;
        }

        .emp-name-cell {
            font-size: 11px;
            font-weight: 700;
            max-width: 90px;
            text-align: center;
            line-height: 1.2;
        }

        .empty-cell-icon {
            color: #475569;
            font-size: 18px;
        }

        /* Employee summary */
        .summary-title {
            font-size: 12px;
            color: #64748B;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 10px;
            margin-top: 20px;
        }

        .summary-grid {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 6px 12px;
        }

        .summary-emp-name {
            font-size: 12px;
            font-weight: 600;
            color: #CBD5E1;
        }

        .summary-emp-count {
            font-size: 10px;
            color: #64748B;
        }

        /* Popup */
        .popup {
            position: fixed;
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,.6);
            z-index: 9999;
            width: 200px;
            overflow: hidden;
            display: none;
        }

        .popup.visible {
            display: block;
        }

        .popup-header {
            padding: 10px 14px;
            border-bottom: 1px solid #334155;
            font-size: 11px;
            font-weight: 700;
            color: #64748B;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .popup-content {
            max-height: 260px;
            overflow-y: auto;
        }

        .popup-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 9px 14px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: #E2E8F0;
            font-size: 13px;
            text-align: left;
            font-family: inherit;
            transition: background 0.1s;
        }

        .popup-btn:hover {
            background: #334155;
        }

        .popup-btn.clear {
            color: #EF4444;
        }

        .popup-btn.clear:hover {
            background: #2D1B1B;
        }

        .popup-btn.selected {
            background: rgba(0, 0, 0, 0.2);
        }

        .popup-emp-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
        }

        .popup-emp-info {
            flex: 1;
        }

        .popup-emp-full {
            font-weight: 600;
            line-height: 1.2;
        }

        .popup-emp-abbr {
            font-size: 10px;
            color: #64748B;
        }

        .popup-check {
            margin-left: auto;
            font-size: 14px;
        }

        .popup-empty {
            padding: 16px 14px;
            color: #475569;
            font-size: 12px;
        }

        /* Settings Tab */
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            color: #CBD5E1;
            margin-bottom: 16px;
            letter-spacing: 0.3px;
        }

        .label {
            font-size: 11px;
            color: #64748B;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .button-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            background: #334155;
            color: #94A3B8;
            transition: all 0.15s;
            font-family: inherit;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .btn.primary {
            background: #3B82F6;
            color: #fff;
        }

        .btn.success {
            background: #10B981;
            color: #fff;
        }

        .btn.danger {
            background: #450A0A;
            color: #EF4444;
        }

        .btn.sm {
            padding: 3px 8px;
            font-size: 11px;
        }

        .btn.sm.save {
            background: #10B981;
            color: #fff;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border-radius: 8px;
            background: #0F172A;
            border: 1px solid #334155;
            color: #E2E8F0;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }

        input[type="text"]:focus {
            border-color: #3B82F6;
        }

        .edit-input {
            padding: 4px 8px !important;
            font-size: 12px !important;
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 280px;
            overflow-y: auto;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0F172A;
            border-radius: 8px;
            padding: 8px 10px;
        }

        .item-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-size: 13px;
            font-weight: 600;
            color: #E2E8F0;
        }

        .item-abbr {
            font-size: 10px;
            color: #64748B;
        }

        .empty-message {
            color: #475569;
            font-size: 12px;
            text-align: center;
            padding: 16px;
        }

        .shift-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0F172A;
            border-radius: 8px;
            padding: 8px 10px;
        }

        .shift-color-bar {
            width: 8px;
            height: 32px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .shift-item-info {
            flex: 1;
        }

        .shift-item-label {
            font-size: 13px;
            font-weight: 700;
        }

        .shift-item-time {
            font-size: 10px;
            color: #64748B;
        }

        .shift-limit-warning {
            background: #1A1200;
            border: 1px solid #78350F;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #FCD34D;
        }

        .day-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .day-btn {
            padding: 6px 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            background: #334155;
            color: #94A3B8;
            transition: all 0.15s;
            font-family: inherit;
        }

        .day-btn.active {
            background: #8B5CF6;
            color: #fff;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            table {
                min-width: 500px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-title">
            <div class="subtitle">BP SNOOKER CLUB</div>
            <div class="title">ตารางงานพนักงาน</div>
        </div>
        <div class="tab-buttons">
            <button class="tab-btn active" data-tab="schedule">📅 ตาราง</button>
            <button class="tab-btn" data-tab="settings">⚙️ ตั้งค่า</button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Schedule Tab -->
        <div id="schedule" class="tab-content active">
            <div class="info-bar">
                <div class="chip"><span>📆</span> <span id="days-info">7 วัน/สัปดาห์</span></div>
                <div class="chip"><span>👤</span> <span id="emp-info">3 พนักงาน</span></div>
                <div class="chip"><span>⏱</span> <span id="shifts-info">3 ช่วงเวลา</span></div>
                <div class="chip"><span>✅</span> <span id="schedule-info">0 กะที่จัด</span></div>
            </div>

            <div class="table-wrapper">
                <table id="scheduleTable">
                    <thead>
                        <tr id="headerRow">
                            <th>ช่วงเวลา</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>

            <div id="summarySection"></div>
        </div>

        <!-- Settings Tab -->
        <div id="settings" class="tab-content">
            <div class="settings-grid">
                <!-- Week Settings -->
                <div class="card">
                    <div class="card-title">📆 ตั้งค่าสัปดาห์</div>
                    <div class="label">จำนวนวันต่อสัปดาห์</div>
                    <div class="button-group" id="daysPerWeekBtns"></div>
                    <div class="label">วันเริ่มต้นสัปดาห์</div>
                    <div class="day-buttons" id="startDayBtns"></div>
                </div>

                <!-- Employees -->
                <div class="card">
                    <div class="card-title">👤 จัดการพนักงาน</div>
                    <div class="input-group">
                        <input type="text" id="newEmpName" placeholder="ชื่อพนักงานใหม่...">
                        <button class="btn primary" onclick="app.addEmployee()">+</button>
                    </div>
                    <div class="items-list" id="employeesList"></div>
                </div>

                <!-- Shifts -->
                <div class="card">
                    <div class="card-title" id="shiftsTitle">⏱ ช่วงเวลา (0/6)</div>
                    <div id="shiftWarning"></div>
                    <div id="shiftInputs"></div>
                    <div class="items-list" id="shiftsList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Popup Picker -->
    <div id="popup" class="popup">
        <div class="popup-header">เลือกพนักงาน</div>
        <div class="popup-content" id="popupContent"></div>
    </div>

    <script>

        const DAY_NAMES = ["อา.", "จ.", "อ.", "พ.", "พฤ.", "ศ.", "ส."];

            return `${first} ${last}.`;

                shiftIdRef: 10,
                editingEmp: null,

                return EMPLOYEE_COLORS[(id - 1) % EMPLOYEE_COLORS.length];

                return `${dayIdx}-${shiftId}`;

                const empId = this.state.schedule[this.cellKey(dayIdx, shiftId)];
                return this.state.employees.find((e) => e.id === empId) || null;
