<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตารางงานพนักงาน - BP SNOOKER CLUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', 'Segoe UI', sans-serif;
            background: #0F172A;
            min-height: 100vh;
            color: #E2E8F0;
        }

        .header {
            background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
            border-bottom: 1px solid #334155;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-title {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .header-title .subtitle {
            font-size: 11px;
            letter-spacing: 3px;
            color: #64748B;
            text-transform: uppercase;
        }

        .header-title .title {
            font-size: 22px;
            font-weight: 700;
            color: #F1F5F9;
            letter-spacing: -0.5px;
        }

        .tab-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            background: #1E293B;
            color: #94A3B8;
            transition: all 0.15s;
        }

        .tab-btn.active {
            background: #3B82F6;
            color: #fff;
        }

        .container {
            padding: 20px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .export-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .export-btn, .import-btn, .reset-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            transition: all 0.15s;
            font-family: inherit;
        }

        .export-btn {
            background: #10B981;
        }
        .export-btn:hover {
            background: #059669;
        }

        .import-btn {
            background: #3B82F6;
        }
        .import-btn:hover {
            background: #2563EB;
        }

        .reset-btn {
            background: #EF4444;
        }
        .reset-btn:hover {
            background: #DC2626;
        }

        #importFile {
            display: none;
        }

        .info-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .chip {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 12px;
            color: #94A3B8;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #1E293B;
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 600px;
        }

        th {
            padding: 12px 10px;
            background: #0F172A;
            color: #CBD5E1;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            min-width: 110px;
            border-left: 1px solid #334155;
        }

        th:first-child {
            text-align: left;
            width: 90px;
            border-left: none;
            padding: 12px 16px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #64748B;
        }

        .day-header-full {
            color: #94A3B8;
            font-size: 11px;
            margin-bottom: 2px;
        }

        .day-header-abbr {
            font-size: 16px;
        }

        td {
            border-top: 1px solid #334155;
            border-left: 1px solid #334155;
            padding: 6px;
            vertical-align: middle;
            text-align: center;
        }

        td:first-child {
            padding: 10px 16px;
            background: #1A2744;
            border-left: none;
            text-align: left;
            font-weight: 600;
        }

        .cell-btn {
            width: 100%;
            min-height: 60px;
            border: 2px dashed #334155;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            transition: all 0.15s;
            color: #E2E8F0;
            font-family: inherit;
            font-size: 12px;
        }

        .cell-btn:hover {
            border-color: #475569;
            background: #0F172A;
        }

        .cell-btn.assigned {
            border: 2px solid;
            background: var(--emp-light);
            color: var(--emp-text);
            border-color: var(--emp-color);
        }

        .emp-name {
            font-weight: 600;
            display: block;
            margin-bottom: 2px;
        }

        .emp-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            background: var(--emp-color);
            color: white;
        }

        .settings-section {
            margin-bottom: 30px;
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
        }

        .settings-title {
            font-size: 16px;
            font-weight: 700;
            color: #F1F5F9;
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        input, select {
            padding: 8px 12px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0F172A;
            color: #E2E8F0;
            font-family: inherit;
            font-size: 13px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #3B82F6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .add-btn {
            padding: 8px 16px;
            background: #3B82F6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.15s;
        }

        .add-btn:hover {
            background: #2563EB;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #0F172A;
            border: 1px solid #334155;
            border-radius: 6px;
        }

        .item-label {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .color-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .remove-btn {
            padding: 4px 10px;
            background: #EF4444;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.15s;
        }

        .remove-btn:hover {
            background: #DC2626;
        }

        .popup {
            position: fixed;
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            max-height: 300px;
            overflow-y: auto;
            min-width: 200px;
        }

        .popup-btn {
            display: block;
            width: 100%;
            padding: 10px 12px;
            background: transparent;
            color: #E2E8F0;
            border: none;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.15s;
            border-bottom: 1px solid #334155;
        }

        .popup-btn:last-child {
            border-bottom: none;
        }

        .popup-btn:hover {
            background: #0F172A;
            color: #3B82F6;
        }

        .popup-btn.danger {
            color: #EF4444;
        }

        @media (max-width: 768px) {
            .header {
                padding: 12px 16px;
            }

            .header-title .title {
                font-size: 18px;
            }

            .container {
                padding: 16px;
            }

            .table-wrapper {
                font-size: 12px;
            }

            th, td {
                padding: 6px 4px;
                min-width: 80px;
            }

            .input-group {
                flex-direction: column;
            }

            input, select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">
            <div class="subtitle">BP SNOOKER CLUB</div>
            <div class="title">ตารางงานพนักงาน</div>
        </div>
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('schedule')">📅 ตาราง</button>
            <button class="tab-btn" onclick="switchTab('settings')">⚙️ ตั้งค่า</button>
        </div>
    </div>

    <div class="container">
        <!-- Schedule Tab -->
        <div id="schedule" class="tab-content active">
            <div class="export-bar">
                <button class="export-btn" onclick="exportToExcel()">📥 ดาวน์โหลด Excel</button>
                <button class="import-btn" onclick="document.getElementById('importFile').click()">📤 นำเข้า Excel</button>
                <button class="reset-btn" onclick="resetSchedule()">🔄 รีเซ็ต</button>
                <input type="file" id="importFile" accept=".xlsx,.xls" onchange="importFromExcel(event)">
            </div>

            <div class="info-bar">
                <div class="chip">📊 สัปดาห์: <span id="weekInfo">7</span> วัน</div>
                <div class="chip">👥 พนักงาน: <span id="empCount">0</span> คน</div>
                <div class="chip">⏰ กะ: <span id="shiftCount">0</span> กะ</div>
                <div class="chip">📋 ทั้งหมด: <span id="totalSchedule">0</span> ตำแหน่ง</div>
            </div>

            <div class="table-wrapper">
                <table id="scheduleTable"></table>
            </div>
        </div>

        <!-- Settings Tab -->
        <div id="settings" class="tab-content">
            <div class="settings-section">
                <div class="settings-title">📆 วันในสัปดาห์</div>
                <div class="input-group">
                    <label style="display: flex; align-items: center; gap: 8px;">
                        จำนวนวัน:
                        <select id="daysPerWeek" onchange="updateSettings()">
                            <option value="5">5 วัน</option>
                            <option value="6">6 วัน</option>
                            <option value="7" selected>7 วัน</option>
                        </select>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px;">
                        วันเริ่มต้น:
                        <select id="startDay" onchange="updateSettings()">
                            <option value="1">จันทร์</option>
                            <option value="0">อาทิตย์</option>
                            <option value="2">อังคาร</option>
                        </select>
                    </label>
                </div>
            </div>

            <div class="settings-section">
                <div class="settings-title">👥 พนักงาน</div>
                <div class="input-group">
                    <input type="text" id="newEmpName" placeholder="ชื่อพนักงาน">
                    <button class="add-btn" onclick="addEmployee()">➕ เพิ่ม</button>
                </div>
                <div class="item-list" id="employeeList"></div>
            </div>

            <div class="settings-section">
                <div class="settings-title">⏰ กะ</div>
                <div class="input-group">
                    <input type="text" id="newShiftLabel" placeholder="ชื่อกะ (เช่น เช้า)">
                    <input type="text" id="newShiftTime" placeholder="เวลา (เช่น 08:00–12:00)">
                    <button class="add-btn" onclick="addShift()">➕ เพิ่ม</button>
                </div>
                <div class="item-list" id="shiftList"></div>
            </div>
        </div>
    </div>

    <div id="popup" class="popup" style="display: none;"></div>

    <script>
        // Constants
        const DAY_NAMES = ["อา.", "จ.", "อ.", "พ.", "พฤ.", "ศ.", "ส."];
        const DAY_FULL = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัส", "ศุกร์", "เสาร์"];
        const EMPLOYEE_COLORS = [
            "#3B82F6","#10B981","#F59E0B","#EF4444","#8B5CF6",
            "#EC4899","#06B6D4","#84CC16","#F97316","#6366F1",
            "#14B8A6","#F43F5E","#A855F7","#22C55E","#FBBF24",
        ];
        const DEFAULT_EMPLOYEES = [
            { id: 1, name: "สมชาย ใจดี" },
            { id: 2, name: "มานี รักเรียน" },
            { id: 3, name: "วิทยา สุขใส" },
        ];
        const DEFAULT_SHIFTS = [
            { id: 1, label: "เช้า", time: "08:00–12:00" },
            { id: 2, label: "บ่าย", time: "13:00–17:00" },
            { id: 3, label: "ดึก", time: "18:00–22:00" },
        ];

        // State
        let daysPerWeek = 7;
        let startDay = 1;
        let employees = JSON.parse(localStorage.getItem('employees')) || DEFAULT_EMPLOYEES;
        let shifts = JSON.parse(localStorage.getItem('shifts')) || DEFAULT_SHIFTS;
        let schedule = JSON.parse(localStorage.getItem('schedule')) || {};
        let empIdRef = Math.max(...employees.map(e => e.id), 3) + 1;
        let shiftIdRef = Math.max(...shifts.map(s => s.id), 3) + 1;

        function saveState() {
            localStorage.setItem('employees', JSON.stringify(employees));
            localStorage.setItem('shifts', JSON.stringify(shifts));
            localStorage.setItem('schedule', JSON.stringify(schedule));
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
        }

        function updateSettings() {
            daysPerWeek = parseInt(document.getElementById('daysPerWeek').value);
            startDay = parseInt(document.getElementById('startDay').value);
            renderSchedule();
        }

        function addEmployee() {
            const name = document.getElementById('newEmpName').value.trim();
            if (!name) return;
            employees.push({ id: empIdRef++, name });
            document.getElementById('newEmpName').value = '';
            saveState();
            renderSettings();
            renderSchedule();
        }

        function removeEmployee(id) {
            employees = employees.filter(e => e.id !== id);
            Object.keys(schedule).forEach(k => {
                if (schedule[k] === id) delete schedule[k];
            });
            saveState();
            renderSettings();
            renderSchedule();
        }

        function addShift() {
            const label = document.getElementById('newShiftLabel').value.trim();
            const time = document.getElementById('newShiftTime').value.trim();
            if (!label || !time) return;
            shifts.push({ id: shiftIdRef++, label, time });
            document.getElementById('newShiftLabel').value = '';
            document.getElementById('newShiftTime').value = '';
            saveState();
            renderSettings();
            renderSchedule();
        }

        function removeShift(id) {
            shifts = shifts.filter(s => s.id !== id);
            Object.keys(schedule).forEach(k => {
                if (k.endsWith(`-${id}`)) delete schedule[k];
            });
            saveState();
            renderSettings();
            renderSchedule();
        }

        function getEmpColor(id) {
            return EMPLOYEE_COLORS[(id - 1) % EMPLOYEE_COLORS.length];
        }

        function renderSchedule() {
            const days = Array.from({ length: daysPerWeek }, (_, i) => (startDay + i) % 7);
            const table = document.getElementById('scheduleTable');
            table.innerHTML = '';

            // Header
            const thead = table.createTHead();
            const headerRow = thead.insertRow();
            const th = document.createElement('th');
            th.textContent = 'กะ';
            headerRow.appendChild(th);

            days.forEach(day => {
                const th = document.createElement('th');
                th.innerHTML = `<div class="day-header-full">${DAY_FULL[day]}</div><div class="day-header-abbr">${DAY_NAMES[day]}</div>`;
                headerRow.appendChild(th);
            });

            // Body
            const tbody = table.createTBody();
            shifts.forEach(shift => {
                const row = tbody.insertRow();
                const cell = row.insertCell();
                cell.innerHTML = `<strong>${shift.label}</strong><div style="font-size:10px;color:#64748B">${shift.time}</div>`;

                days.forEach((_, dayIdx) => {
                    const cell = row.insertCell();
                    const key = `${dayIdx}-${shift.id}`;
                    const empId = schedule[key];
                    const emp = employees.find(e => e.id === empId);

                    const btn = document.createElement('button');
                    btn.className = 'cell-btn';
                    if (emp) {
                        const color = getEmpColor(empId);
                        btn.classList.add('assigned');
                        btn.style.setProperty('--emp-color', color);
                        btn.style.setProperty('--emp-light', color + '20');
                        btn.style.setProperty('--emp-text', color);
                        btn.innerHTML = `<span class="emp-name">${emp.name}</span>`;
                    }
                    btn.onclick = (e) => showPopup(e, dayIdx, shift.id);
                    cell.appendChild(btn);
                });
            });

            updateStats();
        }

        function showPopup(e, dayIdx, shiftId) {
            const popup = document.getElementById('popup');
            popup.innerHTML = '';

            employees.forEach(emp => {
                const btn = document.createElement('button');
                btn.className = 'popup-btn';
                btn.textContent = emp.name;
                btn.onclick = () => assignEmployee(dayIdx, shiftId, emp.id);
                popup.appendChild(btn);
            });

            const clearBtn = document.createElement('button');
            clearBtn.className = 'popup-btn danger';
            clearBtn.textContent = 'ลบ';
            clearBtn.onclick = () => assignEmployee(dayIdx, shiftId, null);
            popup.appendChild(clearBtn);

            popup.style.display = 'block';
            popup.style.left = e.pageX + 'px';
            popup.style.top = e.pageY + 'px';

            setTimeout(() => {
                document.addEventListener('click', closePopup);
            }, 0);
        }

        function closePopup() {
            document.getElementById('popup').style.display = 'none';
            document.removeEventListener('click', closePopup);
        }

        function assignEmployee(dayIdx, shiftId, empId) {
            const key = `${dayIdx}-${shiftId}`;
            if (empId === null) {
                delete schedule[key];
            } else {
                schedule[key] = empId;
            }
            saveState();
            renderSchedule();
            closePopup();
        }

        function updateStats() {
            document.getElementById('weekInfo').textContent = daysPerWeek;
            document.getElementById('empCount').textContent = employees.length;
            document.getElementById('shiftCount').textContent = shifts.length;
            document.getElementById('totalSchedule').textContent = Object.keys(schedule).length;
        }

        function renderSettings() {
            // Employees
            const empList = document.getElementById('employeeList');
            empList.innerHTML = '';
            employees.forEach(emp => {
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                    <div class="item-label">
                        <div class="color-box" style="background: ${getEmpColor(emp.id)}"></div>
                        <span>${emp.name}</span>
                    </div>
                    <button class="remove-btn" onclick="removeEmployee(${emp.id})">ลบ</button>
                `;
                empList.appendChild(item);
            });

            // Shifts
            const shiftList = document.getElementById('shiftList');
            shiftList.innerHTML = '';
            shifts.forEach(shift => {
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                    <div class="item-label">
                        <strong>${shift.label}</strong>
                        <span style="color: #64748B">${shift.time}</span>
                    </div>
                    <button class="remove-btn" onclick="removeShift(${shift.id})">ลบ</button>
                `;
                shiftList.appendChild(item);
            });
        }

        function exportToExcel() {
            const data = [];
            const days = Array.from({ length: daysPerWeek }, (_, i) => (startDay + i) % 7);

            // Header
            const headers = ['กะ', ...days.map(d => DAY_FULL[d])];
            data.push(headers);

            // Data
            shifts.forEach(shift => {
                const row = [shift.label];
                days.forEach((_, dayIdx) => {
                    const key = `${dayIdx}-${shift.id}`;
                    const empId = schedule[key];
                    const emp = employees.find(e => e.id === empId);
                    row.push(emp ? emp.name : '');
                });
                data.push(row);
            });

            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Schedule');
            XLSX.writeFile(wb, 'schedule.xlsx');
        }

        function importFromExcel(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

                    schedule = {};
                    const days = Array.from({ length: daysPerWeek }, (_, i) => (startDay + i) % 7);

                    for (let i = 1; i < rows.length; i++) {
                        const shiftLabel = rows[i][0];
                        const shift = shifts.find(s => s.label === shiftLabel);
                        if (!shift) continue;

                        for (let j = 1; j < rows[i].length; j++) {
                            const empName = rows[i][j];
                            const emp = employees.find(e => e.name === empName);
                            if (emp) {
                                const dayIdx = j - 1;
                                schedule[`${dayIdx}-${shift.id}`] = emp.id;
                            }
                        }
                    }

                    saveState();
                    renderSchedule();
                } catch (err) {
                    alert('ไม่สามารถนำเข้าไฟล์ได้: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function resetSchedule() {
            if (confirm('แน่ใจหรือไม่ที่จะรีเซ็ตตารางงาน?')) {
                schedule = {};
                saveState();
                renderSchedule();
            }
        }

        // Initialize
        renderSchedule();
        renderSettings();
    </script>
</body>
</html>
